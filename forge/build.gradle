plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '7.0.40'
    id 'net.minecraftforge.jarjar' version '0.2.3'
}

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: minecraft_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg').exists()

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('runs/' + name)

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                }
            }

            args "--mixin.config=${mod_id}.mixins.json", "--mixin.config=${mod_id}.forge.mixins.json", "--mixin.config=${mod_id}.jei.mixins.json"

            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }

        register('client') {}
        register('server') { args '--nogui' }
    }
}

sourceSets.main.resources { srcDir layout.projectDirectory.dir('src/generated/resources') }

repositories {
    minecraft.mavenizer(it)
    maven fg.minecraftLibsMaven
    maven fg.forgeMaven
    mavenCentral()
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

configurations {
    localRuntime {
        canBeConsumed = false
        canBeResolved = false
    }
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    compileOnly project(':common')
    compileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    localRuntime("mezz.jei:jei-${minecraft_version}-forge:${jei_version}") {
        exclude group: 'mezz.jei'
        exclude group: 'net.mezzdev.config', module: "mezz_config-${minecraft_version}-config-api"
    }
    localRuntime("net.mezzdev.config:mezz_config-${minecraft_version}-forge:${mezz_config_version}")
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json,${mod_id}.jei.mixins.json"
        ])
    }
}

jarJar.register() {
    archiveClassifier = null
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'forge')
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
